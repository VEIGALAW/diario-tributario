livro:
  titulo: "Tributação sobre lucros e dividendos: uma análise comparada entre os métodos de integração no Chile e no Brasil"
  meta: "IBDT — Instituto Brasileiro de Direito Tributário · São Paulo · 2025"
  desc: "Fruto do Mestrado Profissional em Direito Tributário Internacional e Comparado (IBDT), sob orientação da Profa. Dra. Martha Toribio Leão. A obra reconstrói a história da tributação da renda, sistematiza os métodos de integração entre pessoa jurídica e pessoa física e usa trinta anos de experiência chilena para diagnosticar o modelo brasileiro, antecipando o debate que desaguaria na Lei nº 15.270/2025."

academicos:
  - titulo: "O Imposto de Renda Mínimo, os métodos de integração e o exemplo chileno: contributo para o debate da reforma da tributação da renda no Brasil"
    autores: "Martha Toribio Leão e Rafael Maldonado Canesso"
    veiculo: "Revista de Direito Tributário da APET, n. 53"
    ano: "2026"
    url: "https://revistas.apet.org.br/index.php/rdta/article/view/825"
    desc: "Exame crítico do IRPFM instituído pela Lei nº 15.270/2025 e de seus efeitos sobre a integração entre a tributação da pessoa jurídica e da pessoa física, em diálogo com o modelo chileno de imputação."

