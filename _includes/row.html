<li>
  <a class="row" href="{{ include.post.url | relative_url }}">
    <span class="row-no" aria-hidden="true">{% if include.n < 10 %}0{% endif %}{{ include.n }}</span>
    <span class="row-main">
      <h3>{{ include.post.title }}</h3>
      <span class="row-sum">{{ include.post.resumo }}</span>
    </span>
    <span class="row-meta">
      <span class="pill">{{ include.post.categoria_label | default: "Diário" }}</span>
      <time datetime="{{ include.post.date | date: '%Y-%m-%d' }}">{{ include.post.date | date: "%d.%m.%Y" }}</time>
      <span>{{ include.post.content | number_of_words | divided_by: 190 | at_least: 1 }} min</span>
    </span>
  </a>
</li>
