title: "Diário Tributário"
tagline: "Estudos, ideias e indagações de Rafael Maldonado Canesso"
description: "O diário de Rafael Maldonado Canesso na jornada do direito tributário: doutorado na PUC-SP, prática tributária, leituras, vídeos e indagações."
author:
  name: "Rafael Maldonado Canesso"
  email: "maldonadocanesso@gmail.com"

# Dados estruturados (jekyll-seo-tag): perfis oficiais do autor
social:
  name: "Rafael Maldonado Canesso"
  links:
    - "https://www.youtube.com/@rafaelmaldonadocanesso"
    - "https://www.migalhas.com.br/autor/rafael-maldonado-canesso"
url: "https://veigalaw.github.io"
baseurl: "/diario-tributario"
lang: "pt-BR"
timezone: "America/Sao_Paulo"

youtube_channel: "https://www.youtube.com/@rafaelmaldonadocanesso"
migalhas_author: "https://www.migalhas.com.br/autor/rafael-maldonado-canesso"

permalink: /diario/:title/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
